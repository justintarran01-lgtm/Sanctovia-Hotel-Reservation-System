<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctovia - Log In</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="page-wrapper">
    <div class="image-container">
      <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=1000&q=80" alt="Sanctovia Hotel Room">
    </div>

    <div class="form-wrapper">
      <div class="brand-header">
        <h1>Sanctovia</h1>
        <p>Unwind in a world curated just for you.</p>
      </div>

      <h2>Log In</h2>

      <form action="login.php" method="POST">
        <div class="form-group">
          <input type="email" id="login-email" name="email" placeholder="ENTER EMAIL" required>
        </div>

        <div class="form-group">
          <input type="password" id="login-password" name="password" placeholder="ENTER PASSWORD" required>
        </div>

        <button type="submit" class="btn-submit">Log In</button>
      </form>

      <div class="divider">
        <span>Or</span>
      </div>

      <div class="switch-auth">
        <a href="register.html" class="btn-switch">Don't have an Account? <span>Sign up</span></a>
      </div>
    </div>
  </div>

</body>
</html>
